version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neftecode-api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      # По умолчанию REPLAY_STRICT — реальный LLM не нужен. Чтобы подключить живую
      # модель, экспортируйте эти переменные перед `docker compose up` (см. README_JURY.md).
      - NEFTEKOD_LLM_MODE=${NEFTEKOD_LLM_MODE:-LIVE_RECORD}
      - NEFTEKOD_LLM_BASE_URL=${NEFTEKOD_LLM_BASE_URL:-https://ai.api.cloud.yandex.net/v1}
      - NEFTEKOD_LLM_API_KEY=${NEFTEKOD_LLM_API_KEY:-AQVN1rspcvVHD8Mgou_vIyum_GV81b089AV-hkd2}
      - NEFTEKOD_LLM_MODEL=${NEFTEKOD_LLM_MODEL:-gpt://b1gcd734pg9tuams69cg/gpt-oss-20b/latest}

      #- NEFTEKOD_LLM_MODE=${NEFTEKOD_LLM_MODE:-REPLAY_STRICT}
      #- NEFTEKOD_LLM_BASE_URL=${NEFTEKOD_LLM_BASE_URL:-}
      #- NEFTEKOD_LLM_API_KEY=${NEFTEKOD_LLM_API_KEY:-}
      #- NEFTEKOD_LLM_MODEL=${NEFTEKOD_LLM_MODEL:-}

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 60s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neftecode-tests
    command: pytest -v tests/
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    profiles:
      - test
